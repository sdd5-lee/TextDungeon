plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.secrets)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }

android {
    namespace 'com.example.textdungeon'
    compileSdk 36

    defaultConfig {
        // com.example은 Play에 올릴 수 없어서 바꿨다. 소스 패키지(namespace)는 그대로 둔다.
        // Play에 한 번 올리면 다시 바꿀 수 없다
        applicationId "com.lkj.textdungeon"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // 디버그 측정 화면(클라우드 비교)만 쓰는 키. 게임은 클라우드를 쓰지 않으므로 출시 APK에는 넣지 않는다
            buildConfigField "String", "GEMINI_API_KEY_GODS", "\"${localProperties.getProperty('GEMINI_API_KEY_GODS', '')}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 온디바이스 모델(LiteRT-LM)은 arm64-v8a와 x86_64만 지원하고, 출시는 arm64 폰만 대상으로 한다.
            // 디버그 빌드는 에뮬레이터(x86_64)에서 시험하려고 걸지 않는다
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // JVM 단위 테스트에서 android.util.Log 같은 안드로이드 API를 부르면 예외 대신 기본값을 돌려준다
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// local.properties의 모든 값이 BuildConfig에 들어가 APK에 실린다 (출시 빌드는 난독화도 안 함).
// 앱이 쓰지 않는 값은 여기 적어 빼 둔다. 서명 비밀번호 같은 것은 local.properties에 두지 말 것
secrets {
    propertiesFileName = "local.properties"
    defaultPropertiesFileName = "local.defaults.properties"
    ignoreList.add('^GEMINI_API_KEY$') // 정규식이라 끝을 묶어 둔다. 예전 주사위용 키. 주사위는 이제 클라우드를 쓰지 않는다
    ignoreList.add('^GEMINI_API_KEY_GODS$') // 이벤트 생성용 키. 디버그 빌드에만 따로 넣는다 (위 buildTypes.debug)
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // LiteRT-LM이 2.14.0을 끌어와서 실제로는 2.14.0을 쓴다 (GsonRegressionTest로 세이브·이벤트 파싱 확인)
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "androidx.media3:media3-exoplayer:1.3.0"
    implementation "androidx.media3:media3-common:1.3.0"

    // 혼돈의 주사위 온디바이스 LLM (Gemma 4 E2B). 0.17.1에서는 0-A의 Qwen3 모델 파일에
    // 사용자 입력이 전달되지 않아 0.18.0으로 올렸다. gson이 2.14로 같이 오른다
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'

    testImplementation 'org.mockito:mockito-core:5.5.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // 유료 상품(광고 스킵, 젬 부스터, 시나리오). 2026-08-31부터 새 앱·업데이트는 8 이상 필수
    implementation 'com.android.billingclient:billing:9.1.0'
    // 보상형 광고. 기존 SDK는 유지보수 모드지만, 차세대 SDK는 guava·코루틴 등 의존성이 커서 기존 SDK를 쓴다
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // 유럽경제지역·영국·스위스 광고 동의 창. 광고 SDK가 이미 끌어오는 버전을 직접 적어 둔다
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

}